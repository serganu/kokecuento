  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/efectos.css">
  <link rel="stylesheet" href="css/libro.css">
  <script>
    // Animaciones solo si el visitante no ha pedido reducirlas.
    // La cubierta del libro hace de pantalla de carga: sale al entrar o recargar, pero no al pasar
    // de una página a otra de la tienda (ahí ya hay un efecto de paso de página).
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var raiz = document.documentElement, nav = performance.getEntriesByType("navigation")[0];
      var interna = document.referrer.indexOf(location.origin) === 0 && nav && nav.type !== "reload";
      raiz.classList.add("anim");
      if (!interna) raiz.classList.add("cubierta-on");
    })();
  </script>
</head>
<body>
  <div class="cubierta" id="cubierta" aria-hidden="true">
    <div class="cubierta-hoja">
      <div class="cubierta-marco">
        <p class="cubierta-sub">Kokedamas hechas a mano</p>
        <p class="cubierta-titulo">KokeCuento</p>
        <div class="cubierta-medallon"><img src="img/simbolo.webp" alt="" width="250" height="250"></div>
        <p class="cubierta-lema">Érase una vez…</p>
        <p class="cubierta-carga">Abriendo el cuento</p>
      </div>
    </div>
  </div>
  <header class="barra">
    <div class="contenedor">
      <a href="index.html" aria-label="KokeCuento, inicio"><img src="img/logo.png" alt="KokeCuento" width="600" height="269"></a>
      <nav aria-label="Principal">
        <a href="index.html#kokedamas">Kokedamas</a>
        <a href="index.html#como-funciona" class="opcional">Cómo funciona</a>
        <a href="index.html#preguntas">Envíos y cuidados</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenedor">
      <p class="migas"><a href="index.html">Inicio</a> › <a href="index.html#kokedamas">Kokedamas</a> › <span id="miga"></span></p>
      <article class="producto" id="producto"></article>
    </div>
    <section class="seccion suave">
      <div class="contenedor">
        <div class="cabecera-seccion"><h2>También te pueden gustar</h2></div>
        <div class="rejilla" id="rejilla"></div>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <div>
        <p class="marca">KokeCuento</p>
        <p>Kokedamas hechas a mano que cuentan historias.</p>
      </div>
      <div id="contacto"></div>
    </div>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/tienda.js"></script>
  <script src="js/efectos.js"></script>
</body>
</html>
